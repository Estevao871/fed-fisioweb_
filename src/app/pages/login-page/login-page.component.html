<div class="login-page">
  <div class="login-container">

    <!-- TOP BAR -->
    <div class="login-topbar">
      <a routerLink="/" class="brand" aria-label="Vida em Movimento — página inicial">
        <img src="assets/Logo_Movimento.png" alt="Vida em Movimento" class="brand-logo" />
      </a>
      <a routerLink="/" class="btn btn-ghost btn-sm">← Voltar ao Site</a>
    </div>

    <!-- GRID -->
    <div class="login-grid">

      <!-- LEFT: Profile Select -->
      <section class="profiles-section">
        <h2>Selecione seu Perfil</h2>
        <p class="profiles-subtitle">Escolha o tipo de acesso para continuar</p>

        <div class="profiles-list">
          <button
            class="profile-card"
            *ngFor="let p of profiles"
            [class.active]="selectedType === p.type"
            (click)="selectedType = p.type"
            [attr.aria-pressed]="selectedType === p.type"
          >
            <div class="profile-icon icon-container" [ngClass]="'profile-icon--' + p.colorClass" aria-hidden="true">
              <span class="material-symbols-outlined">{{ p.symbol }}</span>
            </div>
            <div class="profile-info">
              <strong>{{ p.title }}</strong>
              <small>{{ p.description }}</small>
            </div>
            <span class="profile-check material-symbols-outlined" aria-hidden="true">check</span>
          </button>
        </div>
      </section>

      <!-- RIGHT: Login Form -->
      <section class="login-form-card card">

        <h2>Entrar na Plataforma</h2>

        <div class="field-group">
          <label for="email">E-mail</label>
          <input id="email" class="input" type="email" name="email"
            [(ngModel)]="email" placeholder="seu@email.com" autocomplete="email" />
        </div>

        <div class="field-group">
          <label for="password">Senha</label>
          <div class="password-wrap">
            <input id="password" class="input" [type]="showPassword ? 'text' : 'password'" name="password"
              [(ngModel)]="password" placeholder="••••••••" autocomplete="current-password"
              (keydown.enter)="login()" />
            <button type="button" class="eye-btn" (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'">
              <span class="material-symbols-outlined">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
        </div>

        <div class="login-meta">
          <label class="remember-label">
            <input type="checkbox" />
            <span>Lembrar-me</span>
          </label>
          <button type="button" class="forgot-link btn-link" (click)="showForgot = !showForgot">
            Esqueci minha senha
          </button>
        </div>

        <div *ngIf="showForgot" class="forgot-box">
          <span class="material-symbols-outlined" style="font-size:1.1rem;color:var(--purple-600)">info</span>
          <p>
            Para redefinir sua senha, entre em contato com a recepção:
            <br>
            <strong>📞 (11) 9 9999-9999</strong>
            <br>
            <span class="text-xs text-gray">A recepcionista pode redefinir sua senha no painel de administração.</span>
          </p>
        </div>

        <p *ngIf="errorMessage" class="error-msg" role="alert" aria-live="polite">{{ errorMessage }}</p>

        <button class="btn btn-primary login-btn" [disabled]="!selectedType || loading" (click)="login()">
          {{ selectedLabel }}
        </button>

      </section>

    </div>
  </div>
</div>
