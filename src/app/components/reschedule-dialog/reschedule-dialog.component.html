<div class="modal-backdrop" *ngIf="open" (click)="onBackdrop($event)" (keydown.escape)="close()">
  <div class="modal modal-sm rd" role="dialog" aria-modal="true" aria-labelledby="rd-title">

    <!-- ============ SUCESSO ============ -->
    <div *ngIf="success" class="rd-success" role="status">
      <span class="rd-success__icon material-symbols-outlined" aria-hidden="true">check</span>
      <h2 id="rd-title">Sessão reagendada</h2>
      <p><strong>{{ patientName }}</strong> · {{ dataFormatada }} às {{ time }}</p>
      <button type="button" class="btn btn-dark btn-lg" (click)="close()">Fechar</button>
    </div>

    <!-- ============ FORMULÁRIO ============ -->
    <ng-container *ngIf="!success">
      <div class="modal-header">
        <div>
          <h2 id="rd-title">Reagendar sessão</h2>
          <p class="rd-sub">{{ patientName }}<ng-container *ngIf="atual"> · atual: {{ atual }}</ng-container></p>
        </div>
        <button type="button" class="modal-close" (click)="close()" aria-label="Fechar">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <form class="rd-form" (ngSubmit)="confirmar()" novalidate>
        <div class="field-group">
          <label for="rd-date">Nova data <span class="rd-req" aria-hidden="true">*</span></label>
          <input id="rd-date" name="date" class="input" type="date" [min]="dateMin" [class.is-invalid]="fimDeSemana"
            [(ngModel)]="date" (ngModelChange)="onDateChange()" />
          <p *ngIf="fimDeSemana" class="field-error" role="alert">Atendemos de segunda a sexta.</p>
        </div>

        <div class="field-group">
          <label for="rd-hora">Horário <span class="rd-req" aria-hidden="true">*</span></label>
          <select id="rd-hora" name="hora" class="input" [(ngModel)]="time" [disabled]="!date || fimDeSemana || loadingSlots">
            <option value="" disabled>{{ loadingSlots ? 'Verificando agenda…' : 'Selecione' }}</option>
            <option *ngFor="let h of horarios" [value]="h" [disabled]="!livre(h)">{{ h }}{{ livre(h) ? '' : ' · lotado' }}</option>
          </select>
        </div>

        <div class="field-group rd-full" *ngIf="hasSerie">
          <label for="rd-escopo">Aplicar a</label>
          <select id="rd-escopo" name="escopo" class="input" [(ngModel)]="escopo">
            <option value="SOMENTE_ESTA">Somente esta sessão</option>
            <option value="DESTA_EM_DIANTE">Esta e as próximas da série</option>
            <option value="TODA_SERIE">Toda a série</option>
          </select>
        </div>

        <div class="field-group rd-full">
          <div class="rd-label-row">
            <label for="rd-motivo">Observações</label>
            <span class="rd-count" aria-live="polite">{{ motivo.length }}/{{ maxMotivo }}</span>
          </div>
          <textarea id="rd-motivo" name="motivo" class="input" rows="3" [attr.maxlength]="maxMotivo"
            [(ngModel)]="motivo" placeholder="Motivo da remarcação (opcional)"></textarea>
        </div>

        <div *ngIf="error" class="alert-error rd-full" role="alert">
          <span class="material-symbols-outlined" aria-hidden="true">error</span>
          <span>{{ error }}</span>
        </div>

        <div class="modal-footer rd-full">
          <button type="button" class="btn btn-outline" (click)="close()" [disabled]="loading">Cancelar</button>
          <button type="submit" class="btn btn-primary" [disabled]="!isValid || loading">
            {{ loading ? 'Reagendando…' : 'Confirmar reagendamento' }}
          </button>
        </div>
      </form>
    </ng-container>

  </div>
</div>
