<div class="modal-backdrop" *ngIf="open">
  <div class="modal">

    <div class="modal-header">
      <h2>Novo Usuário</h2>
      <button class="modal-close" (click)="close()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div class="form-body">
      <div class="field-group">
        <label>Nome Completo</label>
        <input class="input" [(ngModel)]="name" placeholder="Nome do usuário" />
      </div>

      <div class="grid grid-2" style="gap:.875rem">
        <div class="field-group">
          <label>E-mail</label>
          <input class="input" type="email" [(ngModel)]="email" placeholder="email@exemplo.com" />
          <span class="field-error" *ngIf="email && !emailValido">Formato de e-mail invalido</span>
        </div>
        <div class="field-group">
          <label>Telefone</label>
          <input class="input" [(ngModel)]="phone" placeholder="(11) 99999-9999" />
        </div>
      </div>

      <div class="field-group">
        <label>Tipo de Usuário</label>
        <select class="input" [(ngModel)]="role">
          <option *ngFor="let r of roles" [value]="r.value">{{ r.label }}</option>
        </select>
      </div>

      <div class="grid grid-2" style="gap:.875rem">
        <div class="field-group">
          <label>Senha Inicial</label>
          <div class="password-wrap">
            <input class="input" [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password" placeholder="••••••••" />
            <button type="button" class="eye-btn" (click)="showPassword = !showPassword">
              <span class="material-symbols-outlined">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
        </div>
        <div class="field-group">
          <label>Confirmar Senha</label>
          <div class="password-wrap">
            <input class="input" [type]="showConfirm ? 'text' : 'password'"
              [(ngModel)]="confirmPassword" placeholder="••••••••" />
            <button type="button" class="eye-btn" (click)="showConfirm = !showConfirm">
              <span class="material-symbols-outlined">{{ showConfirm ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
        </div>
      </div>

      <p class="password-mismatch" *ngIf="password && confirmPassword && password !== confirmPassword">
        <span class="material-symbols-outlined">warning</span> As senhas não coincidem
      </p>
      <p class="password-mismatch" *ngIf="password && password.length < 8 && password.length > 0">
        <span class="material-symbols-outlined">warning</span> Senha deve ter pelo menos 8 caracteres
      </p>
      <p class="error-msg" *ngIf="errorMessage" role="alert" aria-live="polite">{{ errorMessage }}</p>
    </div>

    <div class="modal-footer">
      <button class="btn btn-outline" (click)="close()">Cancelar</button>
      <button class="btn btn-primary" (click)="create()" [disabled]="!isValid || loading">
        <span class="material-symbols-outlined">person_add</span>
        {{ loading ? 'Criando...' : 'Criar Usuário' }}
      </button>
    </div>

  </div>
</div>
